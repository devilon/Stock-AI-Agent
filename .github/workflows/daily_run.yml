name: V9.0 每日动态选股运行

on:
  schedule:
    # 每天北京时间早上 6:30 运行 (UTC时间 22:30，周一至周五)
    - cron: '30 22 * * 0-4'
  workflow_dispatch: # 允许手动点击测试

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 120 # 动态抓取数据需要时间，设置最长2小时超时

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装依赖包
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 运行 V9.0 核心模型
      run: python main.py

    - name: 上传结果表格
      uses: actions/upload-artifact@v4
      with:
        name: V10-Quant-Report
        path: "*.xlsx"  # 注意这里从 *.csv 改成了 *.xlsx
